[project]
name = "telegram-parser"
version = "0.1.0"
description = "Парсер новых сообщений из Telegram-каналов и групп папки crypto через user API (Telethon) с сохранением в SQLite"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "prometheus-client>=0.20",
    "python-socks[asyncio]>=2.5",
    "telethon>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
