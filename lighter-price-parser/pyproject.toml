[project]
name = "lighter-price-parser"
version = "0.1.0"
description = "Парсер цен биржи Lighter через публичный WebSocket (market_stats)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["websockets>=14.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
