[project]
name = "lighter-price-parser"
version = "0.1.0"
description = "Рыночные данные биржи Lighter: realtime цены (WebSocket) и исторические свечи OHLCV (REST)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "prometheus-client>=0.20",
    "python-socks[asyncio]>=2.5",
    "websockets>=15.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
